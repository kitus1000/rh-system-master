name: Compilar APK Android Choferes Bacis (100% Offline)

# Desactivado el trigger automático en cada push para evitar compilaciones dobles innecesarias.
# Solo se compilará manualmente cuando tú lo decidas desde el botón "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Capacitor 6.2.0
        run: |
          REPO_DIR="$PWD"
          mkdir -p /tmp/cap-deps
          cd /tmp/cap-deps
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cd "$REPO_DIR"
          rm -rf node_modules
          mv /tmp/cap-deps/node_modules ./node_modules

      - name: Sincronizar Capacitor con Android
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle (Build Real de Android 100% Offline)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir Archivo APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: ChoferesBacis-100-Offline-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
