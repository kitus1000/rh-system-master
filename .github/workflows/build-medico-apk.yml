name: Compilar APK Android Médico Bacís (100% Offline)

# Desactivado el trigger automático en cada push para evitar compilaciones dobles innecesarias.
# Solo se compilará manualmente cuando tú lo decidas desde el botón "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-medico-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Capacitor 6.2.0
        run: |
          REPO_DIR="$PWD"
          mkdir -p /tmp/cap-deps
          cd /tmp/cap-deps
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cd "$REPO_DIR"
          rm -rf node_modules
          mv /tmp/cap-deps/node_modules ./node_modules

      - name: Sincronizar Web Bundle Médico Offline en android-medico
        run: |
          cp capacitor.medico.config.json capacitor.config.json
          node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android-medico/gradlew

      - name: Compilar APK Android Médico Bacís (100% Offline)
        run: |
          cd android-medico
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar y Subir APK Médico Bacís para Descarga
        run: |
          cp android-medico/app/build/outputs/apk/debug/*.apk MedicoBacis-100-Offline-Android.apk || cp android-medico/app/build/outputs/apk/*/*.apk MedicoBacis-100-Offline-Android.apk

      - name: Publicar Artefacto APK Descargable
        uses: actions/upload-artifact@v4
        with:
          name: MedicoBacis-100-Offline-Android
          path: MedicoBacis-100-Offline-Android.apk
          retention-days: 30
